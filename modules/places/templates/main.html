<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js" integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA==" crossorigin="anonymous"></script>
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script src="/static/js/calendar.js"></script>

    <script>
        var socket = io();

        function get_places(address_div, query_div){
            const address = address_div.value;
            const query = query_div.value;

            socket.emit('places', {'address':address, 'query':query});
            clear_places(document.getElementById('places-container'));
        };

        function clear_places(places_div){
            places_div.innerHTML = '';
        }

        socket.on('places-return', function(data){
            console.log(data);
            display_places(document.getElementById('places-container'), data);
        });

        function display_places(places_div, data){
            for (var place of Object.keys(data)){
                places_div.innerHTML += `
                <div class="w-100 card" data-aos="fade-up" data-aos-once="true">
                    <h4>${place}</h4>
                    <p>${data[place]}</p>
                </div>
                `;
            };
        };
    </script>
</head>
<body class="w-100">
    <div class="container mt-5">
        <p>Example:</p>
        <div>1302 S Michigan Avenue, Chicago</div>
        <div>Restaurants</div>
        <div class="row">
            <div class="col-md-8 mb-2">
                <input type="text" class="form-control w-100 mb-1" id="address_div" placeholder="Enter address">
                <input type="text" class="form-control w-100" id="query_div" placeholder="Enter query">
            </div>  
            <div class="col-md-4 mb-2">
                <button class="btn btn-success w-100" onclick="get_places(document.getElementById('address_div'), document.getElementById('query_div'))">Get places</button>
            </div>
            <div class="col-md-12" id="places-container">

            </div>
        </div>
        

    </div>

    <script>
        AOS.init();
    </script>
</body>
</html>
